AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ''
Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
  Api:
    EndpointConfiguration: REGIONAL
Resources:
  PerformancesTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: mod05_Performances
      PrimaryKey:
        Name: Id
        Type: String
  AuditionsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: mod05_Auditions
      PrimaryKey:
        Name: Id
        Type: String
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: mod05-notifications
  SignUpForAuditionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: mod05-sign-up-for-audition
      CodeUri: SignUpForAuditionFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: PerformancesTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AuditionsTable
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - NotificationQueue
            - QueueName
      Environment:
        Variables:
          PERFORMANCES_TABLE:
            Ref: PerformancesTable
          AUDITIONS_TABLE:
            Ref: AuditionsTable
          QUEUE_URL:
            Ref: NotificationQueue
      Events:
        SignUpForAuditionApi:
          Type: Api
          Properties:
            Path: /api/auditions
            Method: POST
    Metadata:
      SamResourceId: SignUpForAuditionFunction
  NotifyDirectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: mod05-notify-director-consumer
      CodeUri: NotifyDirectorFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AuditionsTable
      Environment:
        Variables:
          AUDITIONS_TABLE:
            Ref: AuditionsTable
      Events:
        NotificationQueueEvent:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - NotificationQueue
              - Arn
            BatchSize: 10
    Metadata:
      SamResourceId: NotifyDirectorFunction
Outputs:
  ApiUrl:
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
  PerformancesTableName:
    Value:
      Ref: PerformancesTable
  AuditionsTableName:
    Value:
      Ref: AuditionsTable
  NotificationQueueUrl:
    Value:
      Ref: NotificationQueue
  NotificationQueueArn:
    Value:
      Fn::GetAtt:
      - NotificationQueue
      - Arn
  ProducerFunctionName:
    Value:
      Ref: SignUpForAuditionFunction
  ConsumerFunctionName:
    Value:
      Ref: NotifyDirectorFunction
